name: Build OrangeFox Recovery for Galaxy A7 2018 (a7y18lte)

on:
  workflow_dispatch:
    inputs:
      CREATE_RELEASE:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: false
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'

permissions:
  contents: write

concurrency:
  group: build-a7y18lte-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build OrangeFox Recovery (R12)
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Free Disk Space
      run: |
        sudo apt-get clean
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache /usr/local/aws*
        df -h

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Setup Java 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison binutils-aarch64-linux-gnu build-essential ccache cpio curl flex g++-multilib \
          gcc-multilib git git-lfs gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
          lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev \
          libxml2 libxml2-utils lz4 lzop pngcrush python-is-python3 python2 python2-minimal \
          python3 rsync schedtool squashfs-tools unzip xsltproc zip zlib1g-dev zstd
        git lfs install
        git config --global user.name "eyge102"
        git config --global user.email "180117909+eyge102@users.noreply.github.com"

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo

    - name: Sync OrangeFox R12 (fox_12.1) Sources
      run: |
        export PATH=~/bin:$PATH
        git clone --depth=1 https://gitlab.com/OrangeFox/sync.git -b master ~/ofox_sync
        cd ~/ofox_sync
        bash ./orangefox_sync.sh --branch 12.1 --path /home/runner/fox

    - name: Patch mkbootimg.py for Samsung Boot Header v0 --dt
      run: |
        python3 - <<'PY'
        path = "/home/runner/fox/system/tools/mkbootimg/mkbootimg.py"
        src = open(path, "r", encoding="utf-8").read()

        patches = [
            (
                "    # flash page size\n    args.output.write(pack('I', args.pagesize))\n    # version of boot image header\n    args.output.write(pack('I', args.header_version))\n",
                "    # flash page size\n    args.output.write(pack('I', args.pagesize))\n    # version of boot image header (Samsung Boot Header v0 stores dt_size here)\n"
                "    if args.header_version == 0 and args.dt is not None:\n"
                "        args.output.write(pack('I', filesize(args.dt)))\n"
                "    else:\n"
                "        args.output.write(pack('I', args.header_version))\n",
            ),
            (
                "    update_sha(sha, args.second)\n\n    if args.header_version > 0:",
                "    update_sha(sha, args.second)\n"
                "    if args.header_version == 0 and args.dt is not None:\n"
                "        update_sha(sha, args.dt)\n\n"
                "    if args.header_version > 0:",
            ),
            (
                "    parser.add_argument('--dtb', type=FileType('rb'), help='path to the dtb')\n",
                "    parser.add_argument('--dtb', type=FileType('rb'), help='path to the dtb')\n"
                "    parser.add_argument('--dt', type=FileType('rb'), help='path to the dt image')\n",
            ),
            (
                "    write_padded_file(args.output, args.second, pagesize)\n",
                "    write_padded_file(args.output, args.second, pagesize)\n"
                "    if args.header_version == 0 and args.dt is not None:\n"
                "        write_padded_file(args.output, args.dt, pagesize)\n",
            ),
        ]

        for old, new in patches:
            count = src.count(old)
            assert count == 1, f"Expected 1 match for patch snippet, got {count}: {old!r}"
            src = src.replace(old, new, 1)

        open(path, "w", encoding="utf-8").write(src)
        print("Patched mkbootimg.py successfully for Samsung --dt support.")
        PY

    - name: Copy Device Tree & Patch Prebuilt Kernel (adbd root fix)
      run: |
        mkdir -p /home/runner/fox/device/samsung/a7y18lte
        cp -r $GITHUB_WORKSPACE/* /home/runner/fox/device/samsung/a7y18lte/ || true
        python3 - <<'PY'
        import re
        kpath = "/home/runner/fox/device/samsung/a7y18lte/prebuilt/kernel"
        d = bytearray(open(kpath, "rb").read())
        for old, new in [
            (b"\x00/sbin/adbd\x00", b"\x00/sbin/adbX\x00"),
            (b"\x00/system/bin/adbd\x00", b"\x00/system/bin/adbX\x00"),
        ]:
            hits = [m.start() for m in re.finditer(re.escape(old), d)]
            assert len(hits) in (0, 1), f"Expected 0 or 1 hit for {old!r}, got {len(hits)}"
            if len(hits) == 0:
                print(f"Skipping {old!r}: not present (CONFIG_SEC_RESTRICT_ROOTING disabled)")
                continue
            assert len(old) == len(new)
            d[hits[0]:hits[0] + len(new)] = new
            print(f"Patched {old!r} -> {new!r} at offset {hits[0]}")
        open(kpath, "wb").write(d)
        PY
        ls -la /home/runner/fox/device/samsung/a7y18lte/

    - name: Compile OrangeFox R12
      run: |
        export PATH=~/bin:$PATH
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL="C"
        export FOX_BUILD_DEVICE="a7y18lte"
        export FOX_SAMSUNG_DEVICE=1
        export OF_USE_LEGACY_BATTERY_SERVICES=1
        export FOX_RECOVERY_INSTALL_PARTITION="/dev/block/platform/13500000.dwmmc0/by-name/RECOVERY"
        export FOX_RECOVERY_SYSTEM_PARTITION="/dev/block/platform/13500000.dwmmc0/by-name/SYSTEM"
        export FOX_RECOVERY_VENDOR_PARTITION="/dev/block/platform/13500000.dwmmc0/by-name/VENDOR"
        export FOX_RECOVERY_BOOT_PARTITION="/dev/block/platform/13500000.dwmmc0/by-name/BOOT"
        export OF_MAINTAINER="eyge102"
        export OF_SCREEN_H=2220
        export OF_STATUS_H=80
        export OF_STATUS_INDENT_LEFT=48
        export OF_STATUS_INDENT_RIGHT=48
        export OF_HIDE_NOTCH=1
        export OF_CLOCK_POS=1
        export OF_ALLOW_DISABLE_NAVBAR=0
        export OF_CHECK_OVERWRITE_ATTEMPTS=1
        export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
        export FOX_REPLACE_TOOLBOX_GETPROP=1
        export OF_USE_MAGISKBOOT=1
        export OF_USE_MAGISKBOOT_FOR_ALL_PATCHES=1
        export OF_USE_NEW_MAGISKBOOT=1
        export OF_DONT_PATCH_ENCRYPTED_DEVICE=1
        export OF_NO_TREBLE_COMPATIBILITY_CHECK=1
        export OF_NO_MIUI_PATCHES=1
        export FOX_USE_BASH_SHELL=1
        export FOX_ASH_IS_BASH=1
        export FOX_USE_NANO_EDITOR=1
        export FOX_USE_TAR_BINARY=1
        export FOX_USE_SED_BINARY=1
        export FOX_USE_XZ_UTILS=1
        export OF_FLASHLIGHT_ENABLE=1
        export OF_FL_PATH1="/flashlight"
        export OF_USE_GREEN_LED=0
        export FOX_DELETE_AROMAFM=1
        export OF_USE_LZMA_COMPRESSION=1
        export OF_UNBIND_SDCARD_F2FS=1
        export FOX_LOCAL_CALLBACK_SCRIPT="/home/runner/fox/device/samsung/a7y18lte/fox_local_callback.sh"
        export TW_HAS_MTP=true
        export TW_MTP_DEVICE="/dev/usb-ffs/mtp"
        export TW_EXCLUDE_DEFAULT_USB_INIT=true
        cd /home/runner/fox
        # Fix OrangeFox mtp/ffs/node.cpp sending UINT64 for DATE_MODIFIED/DATE_ADDED/ORIGINAL_RELEASE_DATE (causes libmtp strlen segfault & Windows MTP failure)
        python3 - <<'PY'
        from pathlib import Path
        p = Path("/home/runner/fox/bootable/recovery/mtp/ffs/node.cpp")
        s = p.read_text()
        if '#include "MtpUtils.h"' not in s:
            s = s.replace('#include "MtpDebug.h"', '#include "MtpDebug.h"\n#include "MtpUtils.h"', 1)
        if 'char dateStr[64] = {0};' not in s:
            s = s.replace(
                '\toff_t file_size = 0;',
                '\toff_t file_size = 0;\n\tchar dateStr[64] = {0};\n\tmemset(&st, 0, sizeof(st));',
                1
            )
            s = s.replace(
                '\tif (lstat(path.c_str(), &st) == 0) {',
                '\tif (lstat(path.c_str(), &st) == 0) {\n\t\tformatDateTime(st.st_mtime, dateStr, sizeof(dateStr));',
                1
            )
        s = s.replace(
            'addProperty(MTP_PROPERTY_DATE_MODIFIED, st.st_mtime, "", MTP_TYPE_UINT64);',
            'addProperty(MTP_PROPERTY_DATE_MODIFIED, 0, dateStr, MTP_TYPE_STR);'
        )
        s = s.replace(
            'addProperty(MTP_PROPERTY_DATE_ADDED, st.st_mtime, "", MTP_TYPE_UINT64);',
            'addProperty(MTP_PROPERTY_DATE_ADDED, 0, dateStr, MTP_TYPE_STR);'
        )
        s = s.replace(
            'addProperty(MTP_PROPERTY_ORIGINAL_RELEASE_DATE, 2014, "", MTP_TYPE_UINT64);',
            'addProperty(MTP_PROPERTY_ORIGINAL_RELEASE_DATE, 0, "20140101T000000", MTP_TYPE_STR);'
        )
        p.write_text(s)
        PY
        # orangefox_envsetup returns non-zero when frameworks/base/.../vts/Android.mk is absent in minimal manifest
        set +e
        source build/envsetup.sh
        lunch twrp_a7y18lte-eng
        LUNCH_RET=$?
        set -e
        [ "$LUNCH_RET" -eq 0 ] || { echo "lunch failed with exit code $LUNCH_RET"; exit "$LUNCH_RET"; }
        mka adbd recoveryimage -j$(nproc)

    - name: Prepare Artifacts & Tar Package
      run: |
        mkdir -p $GITHUB_WORKSPACE/output
        find /home/runner/fox/out/target/product/a7y18lte -maxdepth 1 \
          \( -name "OrangeFox-*.zip" -o -name "OrangeFox-*.img" -o -name "OrangeFox-*.tar" -o -name "recovery.img" \) \
          -exec cp {} $GITHUB_WORKSPACE/output/ \; || true
        cd $GITHUB_WORKSPACE/output
        if [ -f recovery.img ] && ! ls OrangeFox-*.tar 1>/dev/null 2>&1; then
          tar -H ustar -cvf OrangeFox-R12.0-a7y18lte-Odin.tar recovery.img
        fi
        ls -lh $GITHUB_WORKSPACE/output/

    - name: Upload Recovery Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-R12-A750F-Recovery
        path: output/*
        if-no-files-found: error

    - name: Create GitHub Release
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.CREATE_RELEASE == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: vR12.0-1
        name: OrangeFox Recovery for Galaxy A7 2018 (vR12.0-1)
        body: |
          ### OrangeFox Recovery Project (R12.0) for Samsung Galaxy A7 2018 (SM-A750F / a7y18lte)
          - Maintainer: @eyge102
          - Base: OrangeFox R12.0 (`fox_12.1` / `twrp-12.1`)
          - Built with GitHub Actions CI
          - Features: MTP ConfigFS fix, Flashlight support, Boot splash support, Root ADB shell patch, Magiskboot v24+, and Odin flashable tar package.
        files: output/*
